name: Evaluated container release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'attention_tracking/**'
      - 'web/**'
      - 'scripts/**'
      - 'tests/**'
      - 'evaluation/**'
      - 'deployment/docker/Dockerfile'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '*.py'
      - '.dockerignore'
      - 'LICENSE'
      - '!scripts/**/*.md'
      - '!scripts/documentation/**'
permissions:
  contents: read
concurrency:
  group: attention-container-release
  cancel-in-progress: false
jobs:
  tests:
    uses: ./.github/workflows/checks.yml
  build:
    needs: tests
    if: github.repository == 'bmaged23/multi-person-attention-tracking' && github.actor == 'bmaged23' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/bmaged23/attention-candidates@${{ steps.image.outputs.digest }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v7.0.1
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        id: image
        with:
          context: .
          file: deployment/docker/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          tags: ghcr.io/bmaged23/attention-candidates:sha-${{ github.sha }}
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=attention
          cache-to: type=gha,scope=attention,mode=max
  qualify:
    needs: build
    runs-on: [self-hosted, Linux, X64, attention-gpu]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      PLAYWRIGHT_BROWSERS_PATH: /mnt/d/voice-bridge-tools/playwright
      CANDIDATE: ${{ needs.build.outputs.image }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach frozen local fixtures and evaluation environment
        run: |
          ln -s /home/bmage/projects/multi-person-attention-tracking/.venv .venv
          ln -s /home/bmage/projects/multi-person-attention-tracking/input input
      - run: docker pull "$CANDIDATE"
      - name: Evaluate exact container and browser upload workflow
        run: |
          mkdir -p .evaluation-local
          .venv/bin/python -m scripts.evaluation.monitor_container_resources --output "$RUNNER_TEMP/attention-resources.json" &
          monitor=$!
          trap 'kill -TERM "$monitor" 2>/dev/null || true; wait "$monitor" || true' EXIT
          .venv/bin/python -m scripts.release.qualify_image --image "$CANDIDATE" --source-sha "$GITHUB_SHA"
      - name: Preserve public aggregate evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: attention-qualification
          path: |
            .evaluation-local/image-gate/gate-summary.json
            ${{ runner.temp }}/attention-resources.json
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve detailed results privately
        if: always()
        run: |
          archive="/home/bmage/projects/multi-person-attention-tracking/.evaluation-local/container-runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p -m 700 "$archive"
          if [ -d .evaluation-local/image-gate ]; then cp -a .evaluation-local/image-gate/. "$archive/"; fi
          if [ -f "$RUNNER_TEMP/attention-resources.json" ]; then cp "$RUNNER_TEMP/attention-resources.json" "$archive/"; fi
  publish:
    needs: [build, qualify]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      CANDIDATE: ${{ needs.build.outputs.image }}
      DIGEST: ${{ needs.build.outputs.digest }}
      IMAGE: bmaged23/multi-person-attention-tracking
    steps:
      - uses: actions/checkout@v7.0.1
      - run: sudo apt-get update -qq && sudo apt-get install -y skopeo
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4.7.0
        with:
          username: bmaged23
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish only the qualified digest
        run: |
          for tag in gpu sha-$GITHUB_SHA; do
            skopeo copy --preserve-digests --authfile "$HOME/.docker/config.json" "docker://$CANDIDATE" "docker://$IMAGE:$tag"
          done
          mkdir -p /tmp/anonymous
          printf '{"auths":{}}' > /tmp/anonymous/auth.json
          skopeo inspect --authfile /tmp/anonymous/auth.json --raw "docker://$IMAGE:gpu" > /tmp/manifest.json
          test "sha256:$(sha256sum /tmp/manifest.json | cut -d' ' -f1)" = "$DIGEST"
      - name: Synchronize source links and usage guide
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: python3 -m scripts.release.update_dockerhub
  verify_public:
    needs: [build, publish]
    runs-on: [self-hosted, Linux, X64, attention-gpu]
    timeout-minutes: 15
    env:
      IMAGE: bmaged23/multi-person-attention-tracking@${{ needs.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7.0.1
      - run: |
          ln -s /home/bmage/projects/multi-person-attention-tracking/.venv .venv
          ln -s /home/bmage/projects/multi-person-attention-tracking/input input
          mkdir -p "$RUNNER_TEMP/attention-anonymous"
          docker --config "$RUNNER_TEMP/attention-anonymous" pull "$IMAGE"
      - name: Verify public GPU and CPU-mode video jobs
        run: |
          .venv/bin/python -m scripts.release.smoke_public_image --image "$IMAGE" --device cuda
          .venv/bin/python -m scripts.release.smoke_public_image --image "$IMAGE" --device cpu
