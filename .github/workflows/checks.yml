name: Checks
on: [push, pull_request, workflow_call]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12.15'
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg libgl1 libglib2.0-0
      - run: python -m pip install --no-deps -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: ruff check .
      - run: ruff format --check attention_tracking scripts tests config.py video_attention.py live_camera_attention.py
